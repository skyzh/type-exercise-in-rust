[workspace]
resolver = "3"
members = [
    "type-exercise/expr",
    "type-exercise/supplied-tests",
    "type-exercise-starter/expr",
    "type-exercise-starter/supplied-tests",
    "xtask",
    "checkpoint/chapter-*/expr",
    "checkpoint/chapter-*/supplied-tests",
]
default-members = [
    "type-exercise/expr",
    "type-exercise/supplied-tests",
    "type-exercise-starter/expr",
    "type-exercise-starter/supplied-tests",
    "xtask",
]
exclude = ["archived/type-exercise-ref", "archived/legacy-days/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/skyzh/type-exercise-in-rust"
homepage = "https://skyzh.github.io/type-exercise-in-rust/"
