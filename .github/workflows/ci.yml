name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustc --version
      - uses: taiki-e/install-action@mdbook
      - name: Check current workspace format
        run: cargo fmt --all -- --check
      - name: Clippy current workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test current workspace and reference solution
        run: cargo test --workspace --locked
      - name: Check minimal starter
        run: cargo check -p type-exercise-starter-expr --lib --locked
      - name: Copy supplied tests into the starter
        run: |
          cargo x copy-test --chapter 1
          cargo x copy-test --chapter 2
          cargo x copy-test --chapter 3
          cargo x copy-test --chapter 4
          cargo x copy-test --chapter 5
          cargo x copy-test --chapter 6
          cargo x copy-test --chapter 7
          cargo x copy-test --chapter 8
          cargo x copy-test --chapter 9
          cargo x copy-test --chapter 10
          cargo x copy-test --chapter 11
          cargo x copy-test --chapter 12
          cargo x copy-test --chapter 13
          cargo x copy-test --chapter 14
          git diff --exit-code -- type-exercise-starter/src ":(exclude)type-exercise-starter/src/tests.rs" ":(exclude)type-exercise-starter/src/tests/**"
      - name: Test course
        run: mdbook test course
