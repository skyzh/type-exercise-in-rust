name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustc --version
      - uses: taiki-e/install-action@mdbook
      - name: Check current workspace format
        run: cargo fmt --all -- --check
      - name: Check archived reference format
        run: cargo fmt --manifest-path archived/type-exercise-ref/Cargo.toml --all -- --check
      - name: Clippy current workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy archived reference
        run: cargo clippy --manifest-path archived/type-exercise-ref/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test current workspace and reference solution
        run: cargo test --workspace --locked
      - name: Test archived reference
        run: cargo test --manifest-path archived/type-exercise-ref/Cargo.toml --no-fail-fast --workspace --all-features --locked
      - name: Check minimal starter
        run: cargo check -p type-exercise-starter --lib --locked
      - name: Check starter API roadmap
        run: cargo x check-starter-api
      - name: Copy supplied tests into the starter
        run: |
          cargo x copy-test --chapter 1
          cargo x copy-test --chapter 2
          cargo x copy-test --chapter 3
      - name: Test course
        run: mdbook test course
      - name: Install sitemap generator
        run: npm install --global static-sitemap-cli@2.2.8
      - name: Check sitemap
        run: course/sitemap.sh --check
