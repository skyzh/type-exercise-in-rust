name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustc --version
      - uses: taiki-e/install-action@nextest
      - name: Check maintained final artifact format
        run: cargo fmt --package type-exercise-core --package type-exercise-expr -- --check
      - name: Check Checkpoint 1 format
        run: cargo fmt --package type-exercise-checkpoint-01-core --package type-exercise-checkpoint-01-expr --package type-exercise-checkpoint-01-supplied-tests -- --check
      - name: Check Checkpoint 2 format
        run: cargo fmt --package type-exercise-checkpoint-02-core --package type-exercise-checkpoint-02-expr --package type-exercise-checkpoint-02-supplied-tests -- --check
      - name: Check Checkpoint 3 format
        run: cargo fmt --package type-exercise-checkpoint-03-core --package type-exercise-checkpoint-03-expr --package type-exercise-checkpoint-03-supplied-tests -- --check
      - name: Check Checkpoint 4 format
        run: cargo fmt --package type-exercise-checkpoint-04-core --package type-exercise-checkpoint-04-expr --package type-exercise-checkpoint-04-supplied-tests -- --check
      - name: Check Checkpoint 5 format
        run: cargo fmt --package type-exercise-checkpoint-05-core --package type-exercise-checkpoint-05-expr --package type-exercise-checkpoint-05-supplied-tests -- --check
      - name: Check Checkpoint 6 format
        run: cargo fmt --package type-exercise-checkpoint-06-core --package type-exercise-checkpoint-06-expr --package type-exercise-checkpoint-06-supplied-tests -- --check
      - name: Check Checkpoint 7 format
        run: cargo fmt --package type-exercise-checkpoint-07-core --package type-exercise-checkpoint-07-expr --package type-exercise-checkpoint-07-supplied-tests -- --check
      - name: Clippy maintained final artifact
        run: cargo clippy --package type-exercise-core --package type-exercise-expr --all-targets --locked -- -D warnings
      - name: Clippy Checkpoint 1
        run: cargo clippy --package type-exercise-checkpoint-01-core --package type-exercise-checkpoint-01-expr --package type-exercise-checkpoint-01-supplied-tests --all-targets --locked -- -D warnings
      - name: Clippy Checkpoint 2
        run: cargo clippy --package type-exercise-checkpoint-02-core --package type-exercise-checkpoint-02-expr --package type-exercise-checkpoint-02-supplied-tests --all-targets --locked -- -D warnings
      - name: Clippy Checkpoint 3
        run: cargo clippy --package type-exercise-checkpoint-03-core --package type-exercise-checkpoint-03-expr --package type-exercise-checkpoint-03-supplied-tests --all-targets --locked -- -D warnings
      - name: Clippy Checkpoint 4
        run: cargo clippy --package type-exercise-checkpoint-04-core --package type-exercise-checkpoint-04-expr --package type-exercise-checkpoint-04-supplied-tests --all-targets --locked -- -D warnings
      - name: Clippy Checkpoint 5
        run: cargo clippy --package type-exercise-checkpoint-05-core --package type-exercise-checkpoint-05-expr --package type-exercise-checkpoint-05-supplied-tests --all-targets --locked -- -D warnings
      - name: Clippy Checkpoint 6
        run: cargo clippy --package type-exercise-checkpoint-06-core --package type-exercise-checkpoint-06-expr --package type-exercise-checkpoint-06-supplied-tests --all-targets --locked -- -D warnings
      - name: Clippy Checkpoint 7
        run: cargo clippy --package type-exercise-checkpoint-07-core --package type-exercise-checkpoint-07-expr --package type-exercise-checkpoint-07-supplied-tests --all-targets --locked -- -D warnings
      - name: Test maintained final artifact
        run: cargo nextest run --package type-exercise-core --package type-exercise-expr --locked
      - name: Test Checkpoint 1
        run: cargo nextest run --package type-exercise-checkpoint-01-core --package type-exercise-checkpoint-01-expr --package type-exercise-checkpoint-01-supplied-tests --locked
      - name: Test Checkpoint 2
        run: cargo nextest run --package type-exercise-checkpoint-02-core --package type-exercise-checkpoint-02-expr --package type-exercise-checkpoint-02-supplied-tests --locked
      - name: Test Checkpoint 3
        run: cargo nextest run --package type-exercise-checkpoint-03-core --package type-exercise-checkpoint-03-expr --package type-exercise-checkpoint-03-supplied-tests --locked
      - name: Test Checkpoint 4
        run: cargo nextest run --package type-exercise-checkpoint-04-core --package type-exercise-checkpoint-04-expr --package type-exercise-checkpoint-04-supplied-tests --locked
      - name: Test Checkpoint 5
        run: cargo nextest run --package type-exercise-checkpoint-05-core --package type-exercise-checkpoint-05-expr --package type-exercise-checkpoint-05-supplied-tests --locked
      - name: Test Checkpoint 6
        run: cargo nextest run --package type-exercise-checkpoint-06-core --package type-exercise-checkpoint-06-expr --package type-exercise-checkpoint-06-supplied-tests --locked
      - name: Test Checkpoint 7
        run: cargo nextest run --package type-exercise-checkpoint-07-core --package type-exercise-checkpoint-07-expr --package type-exercise-checkpoint-07-supplied-tests --locked
      - name: Test maintained final artifact documentation
        run: cargo test --package type-exercise-core --package type-exercise-expr --doc --locked
      - name: Test Checkpoint 1 documentation
        run: cargo test --package type-exercise-checkpoint-01-core --package type-exercise-checkpoint-01-expr --doc --locked
      - name: Test Checkpoint 2 documentation
        run: cargo test --package type-exercise-checkpoint-02-core --package type-exercise-checkpoint-02-expr --doc --locked
      - name: Test Checkpoint 3 documentation
        run: cargo test --package type-exercise-checkpoint-03-core --package type-exercise-checkpoint-03-expr --doc --locked
      - name: Test Checkpoint 4 documentation
        run: cargo test --package type-exercise-checkpoint-04-core --package type-exercise-checkpoint-04-expr --doc --locked
      - name: Test Checkpoint 5 documentation
        run: cargo test --package type-exercise-checkpoint-05-core --package type-exercise-checkpoint-05-expr --doc --locked
      - name: Test Checkpoint 6 documentation
        run: cargo test --package type-exercise-checkpoint-06-core --package type-exercise-checkpoint-06-expr --doc --locked
      - name: Test Checkpoint 7 documentation
        run: cargo test --package type-exercise-checkpoint-07-core --package type-exercise-checkpoint-07-expr --doc --locked
