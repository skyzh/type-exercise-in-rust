name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cargo bootstrap integrity before Cargo
        run: |
          set -euo pipefail
          sha256sum --check .github/course-bootstrap.sha256
          bash .github/test-course-bootstrap.sh | tee "$RUNNER_TEMP/course-bootstrap.log"
          test "$(grep -Fxc 'verified Cargo bootstrap integrity and 12/12 pre-Cargo mutation killers' "$RUNNER_TEMP/course-bootstrap.log")" -eq 1
          isolated_cargo_home="$RUNNER_TEMP/type-exercise-cargo-home"
          mkdir "$isolated_cargo_home"
          test -z "$(find "$isolated_cargo_home" -mindepth 1 -print -quit)"
          printf 'CARGO_HOME=%s\n' "$isolated_cargo_home" >> "$GITHUB_ENV"
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustc --version
      - uses: taiki-e/install-action@mdbook
      - name: Check current workspace format
        run: cargo fmt --all -- --check
      - name: Check archived reference format
        run: cargo fmt --manifest-path archived/type-exercise-ref/Cargo.toml --all -- --check
      - name: Clippy current workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy archived reference
        run: cargo clippy --manifest-path archived/type-exercise-ref/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test current workspace and reference solution
        run: cargo test --workspace --locked
      - name: Assert course guard regression inventory
        run: |
          set -euo pipefail
          cargo test --color never -p type-exercise-xtask --locked -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/course-guard-tests.log"
          test "$(grep -Fc 'test result: ok. 8 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' "$RUNNER_TEMP/course-guard-tests.log")" -eq 1
      - name: Test archived reference
        run: cargo test --manifest-path archived/type-exercise-ref/Cargo.toml --no-fail-fast --workspace --all-features --locked
      - name: Check minimal starter
        run: cargo check -p type-exercise-starter --lib --locked
      - name: Copy supplied tests into the starter
        run: |
          cargo x copy-test --chapter 1
          cargo x copy-test --chapter 2
          cargo x copy-test --chapter 3
          cargo x copy-test --chapter 4
          cargo x copy-test --chapter 5
          cargo x copy-test --chapter 6
          cargo x copy-test --chapter 7
          cargo x copy-test --chapter 8
          cargo x copy-test --chapter 9
          cargo x copy-test --chapter 10
          cargo x copy-test --chapter 11
          cargo x copy-test --chapter 12
      - name: Check course contract synchronization
        run: |
          set -euo pipefail
          cargo x check-course 2>&1 | tee "$RUNNER_TEMP/course-guard.log"
          test "$(grep -Fxc 'verified the exact Chapters 1-12 course source, supplied tests, learner dependencies, README, SVG, SUMMARY, sitemaps, and CI' "$RUNNER_TEMP/course-guard.log")" -eq 1
          test "$(grep -Fxc 'executed the exact real reference inventory: 76/76 tests' "$RUNNER_TEMP/course-guard.log")" -eq 1
      - name: Test course
        run: mdbook test course
      - name: Install sitemap generator
        run: npm install --global static-sitemap-cli@2.2.8
      - name: Check sitemap
        run: course/sitemap.sh --check
