name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustc --version
      - uses: taiki-e/install-action@mdbook
      - name: Check current workspace format
        run: cargo fmt --all -- --check
      - name: Clippy final artifact and checkpoints through Day 8
        run: |
          for package in type-exercise-core type-exercise-expr type-exercise-supplied-tests; do
            cargo clippy -p "$package" --all-targets --locked -- -D warnings
          done
          for day in 01 02 03 04 05 06 07 08; do
            for component in core expr supplied-tests; do
              cargo clippy -p "type-exercise-checkpoint-${day}-${component}" --all-targets --locked -- -D warnings
            done
          done
      - name: Test final artifact and checkpoint implementations through Day 8
        run: |
          cargo test -p type-exercise-core -p type-exercise-expr --locked
          for day in 01 02 03 04 05 06 07 08; do
            cargo test -p "type-exercise-checkpoint-${day}-core" -p "type-exercise-checkpoint-${day}-expr" --locked
          done
      - name: Test final and cumulative supplied contracts through Day 8
        run: |
          cargo test -p type-exercise-supplied-tests --locked
          for day in 01 02 03 04 05 06 07 08; do
            cargo test -p "type-exercise-checkpoint-${day}-supplied-tests" --locked
          done
      - name: Check minimal starter
        run: cargo check -p type-exercise-starter-expr --lib --locked
      - name: Copy supplied tests into the starter
        run: |
          for checkpoint in 1 2 3 4; do cargo x copy-test --chapter 1 --checkpoint "$checkpoint"; done
          for checkpoint in 1 2 3; do cargo x copy-test --chapter 6 --checkpoint "$checkpoint"; done
          for checkpoint in 1 2 3; do cargo x copy-test --chapter 7 --checkpoint "$checkpoint"; done
          for checkpoint in 1 2; do cargo x copy-test --chapter 8 --checkpoint "$checkpoint"; done
          for checkpoint in 1 2 3; do cargo x copy-test --chapter 9 --checkpoint "$checkpoint"; done
          for checkpoint in 1 2 3; do cargo x copy-test --chapter 10 --checkpoint "$checkpoint"; done
          cargo x copy-test --chapter 1
          cargo x copy-test --chapter 2
          cargo x copy-test --chapter 3
          cargo x copy-test --chapter 4
          cargo x copy-test --chapter 5
          cargo x copy-test --chapter 6
          cargo x copy-test --chapter 7
          cargo x copy-test --chapter 8
          cargo x copy-test --chapter 9
          cargo x copy-test --chapter 10
          cargo x copy-test --chapter 11
          cargo x copy-test --chapter 12
          cargo x copy-test --chapter 13
          cargo x copy-test --chapter 14
          git diff --exit-code -- type-exercise-starter/expr/src
      - name: Test course
        run: mdbook test course

  later-checkpoint-diagnostics:
    name: Non-blocking Day ${{ matrix.day }} diagnostic
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        day: ["09", "10", "11", "12", "13", "14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustc --version
      - name: Clippy later checkpoint
        run: |
          for component in core expr supplied-tests; do
            cargo clippy -p "type-exercise-checkpoint-${{ matrix.day }}-${component}" --all-targets --locked -- -D warnings
          done
      - name: Test later checkpoint implementation
        run: cargo test -p "type-exercise-checkpoint-${{ matrix.day }}-core" -p "type-exercise-checkpoint-${{ matrix.day }}-expr" --locked
      - name: Observe later cumulative contract
        run: cargo test -p "type-exercise-checkpoint-${{ matrix.day }}-supplied-tests" --locked
