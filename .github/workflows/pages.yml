name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'skyzh/type-exercise-in-rust' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@mdbook
      - name: Install sitemap generator
        run: npm install --global static-sitemap-cli@2.2.7
      - name: Build course and check sitemap
        run: course/sitemap.sh --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: course/book

  deploy:
    if: ${{ github.repository == 'skyzh/type-exercise-in-rust' }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
